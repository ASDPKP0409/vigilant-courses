<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Courses</title>
<style>
  :root{--bg:#f7f6f4; --panel:#fff; --ink:#16181d; --dim:#6b7280;
        --line:#e7e4df; --accent:#ff7a1a; --accent-ink:#c95a08;
        --shadow:0 1px 2px rgba(20,16,10,.05), 0 8px 28px
        rgba(20,16,10,.07)}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0e1014; --panel:#161920; --ink:#e8eaef; --dim:#9aa3b2;
          --line:#262b35; --accent-ink:#ffa05c;
          --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.35)}}
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--ink); -webkit-font-smoothing:
       antialiased; font:14.5px/1.55 "Segoe UI Variable Text","Inter",
       "Segoe UI",system-ui,sans-serif}
  header{display:flex; align-items:center; gap:14px; height:58px;
         padding:0 26px; background:#15171c; color:#f2f3f5}
  .mark{width:30px; height:30px; border-radius:9px;
        background:linear-gradient(135deg,#ff9440,#f06400);
        display:grid; place-items:center; box-shadow:0 2px 8px
        rgba(240,100,0,.45)}
  .eyebrow{font-size:10.5px; letter-spacing:.14em; font-weight:700;
        color:#9aa1ab; text-transform:uppercase}
  h1{font-size:15px; font-weight:650}
  main{max-width:840px; margin:0 auto; padding:36px 24px}
  main > p{color:var(--dim); font-size:13px; margin:0 2px 18px}
  .card{display:flex; align-items:center; gap:16px;
        background:var(--panel); border:1px solid var(--line);
        border-radius:14px; padding:18px 20px; margin-bottom:12px;
        text-decoration:none; color:var(--ink); box-shadow:var(--shadow);
        transition:border-color .15s}
  .card:hover{border-color:var(--accent)}
  .card h2{font-size:15px; font-weight:650; letter-spacing:-.01em;
        margin-bottom:3px}
  .card p{color:var(--dim); font-size:12.5px}
  .card .go{margin-left:auto; color:var(--accent-ink); font-weight:650;
        font-size:12.5px; white-space:nowrap}
</style>
</head>
<body>
<header><div class="mark"><svg width="14" height="14" viewBox="0 0 14 14">
  <path d="M3.5 1.8v10.4L11.7 7z" fill="#fff"/></svg></div>
  <div><div class="eyebrow">Academy</div><h1>Training Courses</h1></div>
</header>
<main>
<p>Pick a course. Progress is remembered on this device.</p>
<a class="card" href="courses/application-delivery-guidelines/"><div><h2>Application Delivery Guidelines</h2><p>10 lessons · 18 min · quiz</p></div><span class="go">Open course &#8594;</span></a>

</main>
</body>
</html>
