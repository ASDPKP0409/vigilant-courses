<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Delivery Guidelines</title>
<style>
  :root{
    --bg:#f7f6f4; --panel:#ffffff; --panel2:#fbfaf9; --ink:#16181d;
    --dim:#6b7280; --faint:#9aa1ab; --line:#e7e4df; --line2:#efedea;
    --accent:#ff7a1a; --accent-ink:#c95a08; --accent-soft:#fff3e9;
    --good:#189d6c; --good-soft:#e7f6ef; --bad:#d64545; --bad-soft:#fbeded;
    --shadow:0 1px 2px rgba(20,16,10,.05), 0 8px 28px rgba(20,16,10,.07);
    --shell:#15171c; --shell-ink:#f2f3f5; --shell-dim:#9aa1ab;
  }
  [data-theme="dark"]{
    --bg:#0e1014; --panel:#161920; --panel2:#1b1f27; --ink:#e8eaef;
    --dim:#9aa3b2; --faint:#67707e; --line:#262b35; --line2:#20242d;
    --accent:#ff7a1a; --accent-ink:#ffa05c; --accent-soft:#271c12;
    --good:#37c98c; --good-soft:#15291f; --bad:#e5484d; --bad-soft:#2b1719;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.35);
    --shell:#101216; --shell-ink:#f2f3f5; --shell-dim:#8a93a1;
  }
  *{box-sizing:border-box; margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg); color:var(--ink); -webkit-font-smoothing:
       antialiased; font:14.5px/1.55 "Segoe UI Variable Text","Inter",
       "Segoe UI",system-ui,sans-serif}
  button{font:inherit; color:inherit}
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;
       border:2px solid transparent; background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- shell ---------- */
  .shell{position:sticky; top:0; z-index:20; background:var(--shell);
         color:var(--shell-ink); display:flex; align-items:center;
         gap:16px; height:58px; padding:0 22px}
  .mark{width:30px; height:30px; border-radius:9px; flex:none;
        background:linear-gradient(135deg,#ff9440,#f06400);
        display:grid; place-items:center; box-shadow:0 2px 8px
        rgba(240,100,0,.45)}
  .mark svg{display:block}
  .crumb{min-width:0}
  .crumb .eyebrow{font-size:10.5px; letter-spacing:.14em; font-weight:700;
        color:var(--shell-dim); text-transform:uppercase}
  .crumb h1{font-size:15px; font-weight:650; white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em}
  .shell .grow{flex:1}
  .progress{display:flex; align-items:center; gap:10px; min-width:0}
  .progress .pct{font-size:12.5px; font-weight:650; color:var(--shell-ink);
        white-space:nowrap}
  .progress .meta{font-size:12.5px; color:var(--shell-dim);
        white-space:nowrap}
  .pbar{width:130px; height:5px; border-radius:99px;
        background:rgba(255,255,255,.14); overflow:hidden}
  .pbar i{display:block; height:100%; width:0%; border-radius:99px;
        background:linear-gradient(90deg,#ff9440,#ff7a1a);
        transition:width .4s ease}
  .iconbtn{width:34px; height:34px; border-radius:9px; border:1px solid
        rgba(255,255,255,.16); background:none; cursor:pointer;
        color:var(--shell-ink); display:grid; place-items:center}
  .iconbtn:hover{background:rgba(255,255,255,.08)}

  /* ---------- layout: rail | stage | reader ---------- */
  .wrap{display:grid; grid-template-columns:clamp(290px,21vw,370px)
        minmax(0,1fr) clamp(330px,25vw,430px); gap:22px;
        padding:22px 24px; width:100%; align-items:start}
  .wrap.railless{grid-template-columns:54px minmax(0,1fr)
        clamp(330px,25vw,430px)}
  @media (max-width:1100px){
    .wrap, .wrap.railless{grid-template-columns:1fr}
    main{order:1} .side{order:2} .railpanel{order:3; position:static;
        max-height:none}
  }

  /* ---------- stage ---------- */
  .stage{background:#000; border-radius:14px; overflow:hidden;
         box-shadow:var(--shadow)}
  video{width:100%; aspect-ratio:16/9; display:block; background:#000;
        outline:none}
  .lessonbar{display:flex; align-items:center; gap:18px; margin:18px 2px 0}
  .lessonbar .eyebrow{font-size:11px; letter-spacing:.14em;
        font-weight:700; color:var(--accent-ink);
        text-transform:uppercase; margin-bottom:3px}
  .lessonbar h2{font-size:21px; font-weight:650; letter-spacing:-.015em}
  .lessonbar .grow{flex:1}
  .navbtn{display:inline-flex; align-items:center; gap:7px; border:1px
        solid var(--line); background:var(--panel); border-radius:10px;
        padding:8px 14px; cursor:pointer; font-weight:600; font-size:13px;
        color:var(--ink); transition:border-color .15s, background .15s}
  .navbtn:hover:not(:disabled){border-color:var(--accent)}
  .navbtn:disabled{opacity:.4; cursor:default}

  /* ---------- tabs ---------- */
  .tabs{display:inline-flex; background:var(--panel2); border:1px solid
        var(--line); padding:4px; border-radius:12px; margin:14px 14px 12px;
        gap:2px}
  .tabs button{border:0; background:none; padding:7px 18px;
        border-radius:9px; cursor:pointer; font-weight:600;
        font-size:13.5px; color:var(--dim); transition:all .15s}
  .tabs button.on{background:var(--panel); color:var(--ink);
        box-shadow:0 1px 4px rgba(0,0,0,.09)}
  .tabs button:disabled{opacity:.4; cursor:not-allowed}
  .pane{display:none}
  .pane.on{display:block}

  /* ---------- transcript ---------- */
  .tgroup{margin:20px 2px 8px; display:flex; align-items:center; gap:10px}
  .tgroup:first-child{margin-top:4px}
  .tgroup .badge{font-size:10.5px; font-weight:700; letter-spacing:.1em;
        color:var(--accent-ink); background:var(--accent-soft);
        border-radius:6px; padding:3px 8px; text-transform:uppercase;
        white-space:nowrap}
  .tgroup .t{font-size:13px; font-weight:650; color:var(--dim)}
  .line{display:flex; gap:14px; padding:12px 14px; border-radius:12px;
        cursor:pointer; border:1px solid transparent;
        transition:background .15s, border-color .15s}
  .line:hover{background:var(--panel)}
  .line.on{background:var(--panel); border-color:var(--line);
        box-shadow:var(--shadow)}
  .line .st{flex:none; font-size:11.5px; font-weight:700;
        color:var(--accent-ink); background:var(--accent-soft);
        border-radius:6px; padding:3px 7px; height:fit-content;
        margin-top:2px; font-variant-numeric:tabular-nums}
  .line h3{font-size:14px; font-weight:650; margin-bottom:3px;
        letter-spacing:-.01em}
  .line p{color:var(--dim); font-size:13.5px}

  /* ---------- side panels ---------- */
  .railpanel, .side{background:var(--panel); border:1px solid var(--line);
        border-radius:14px; overflow:hidden; box-shadow:var(--shadow);
        position:sticky; top:82px; max-height:calc(100vh - 106px);
        display:flex; flex-direction:column}
  .railhead{padding:14px 16px 12px; border-bottom:1px solid var(--line);
        display:flex; align-items:center; gap:10px}
  .railhead .grow{flex:1; min-width:0}
  .railhead h2{font-size:14px; font-weight:650; letter-spacing:-.01em}
  .railhead p{font-size:12px; color:var(--dim); margin-top:2px}
  .railbody{overflow-y:auto}
  .fold{flex:none; width:30px; height:30px; border-radius:8px; border:1px
        solid var(--line); background:none; cursor:pointer;
        color:var(--dim); display:grid; place-items:center}
  .fold:hover{border-color:var(--accent); color:var(--accent-ink)}
  .railpanel.collapsed .railhead .grow, .railpanel.collapsed .railbody{
        display:none}
  .railpanel.collapsed .railhead{border-bottom:0; padding:10px 11px;
        justify-content:center}
  .railpanel.collapsed .fold svg{transform:rotate(180deg)}
  .sidebody{overflow-y:auto; padding:0 14px 14px}
  .les{width:100%; text-align:left; border:0; background:var(--panel2);
       cursor:pointer; padding:12px 16px; display:flex; gap:12px;
       align-items:center; border-top:1px solid var(--line)}
  .railbody > .les:first-child{border-top:0}
  .les:hover{background:var(--accent-soft)}
  .les .num{flex:none; width:26px; height:26px; border-radius:8px;
       background:var(--panel); border:1px solid var(--line);
       display:grid; place-items:center; font-size:12px; font-weight:700;
       color:var(--dim)}
  .les.on .num{background:var(--accent); border-color:var(--accent);
       color:#fff}
  .les .t{flex:1; min-width:0}
  .les .t b{display:block; font-size:13.5px; font-weight:650;
       letter-spacing:-.01em; line-height:1.35}
  .les .t span{font-size:11.5px; color:var(--dim)}
  .les .chev{flex:none; color:var(--faint); transition:transform .2s}
  .les.closed .chev{transform:rotate(-90deg)}
  .chap{width:100%; text-align:left; border:0; background:none;
       cursor:pointer; padding:8px 16px 8px 18px; display:flex; gap:10px;
       align-items:center}
  .chap:hover{background:var(--accent-soft)}
  .chap.on{background:var(--accent-soft); box-shadow:inset 3px 0 0
       var(--accent)}
  .chap .ic{flex:none; width:18px; height:18px; border-radius:50%;
       border:1.5px solid var(--line); display:grid; place-items:center;
       color:transparent; font-size:10px}
  .chap.watched .ic{border-color:var(--good); background:var(--good);
       color:#fff}
  .chap.on .ic{border-color:var(--accent)}
  .chap .t{flex:1; font-size:13px; color:var(--dim); line-height:1.35}
  .chap.on .t{color:var(--ink); font-weight:600}
  .chap .len{font-size:11.5px; color:var(--faint);
       font-variant-numeric:tabular-nums}
  .hidden{display:none}

  /* ---------- quiz ---------- */
  .qgate{background:var(--panel); border:1px solid var(--line);
       border-radius:14px; padding:40px 24px; text-align:center;
       box-shadow:var(--shadow)}
  .qgate .lock{width:44px; height:44px; border-radius:12px; margin:0 auto
       14px; background:var(--accent-soft); display:grid;
       place-items:center; color:var(--accent-ink)}
  .qgate h3{font-size:17px; font-weight:650; letter-spacing:-.01em}
  .qgate p{color:var(--dim); margin:8px auto 20px; max-width:46ch;
       font-size:13.5px}
  .cta{border:0; cursor:pointer; background:var(--accent); color:#fff;
       font-weight:650; font-size:14px; border-radius:10px;
       padding:11px 26px; box-shadow:0 2px 10px rgba(240,100,0,.35);
       transition:filter .15s}
  .cta:hover{filter:brightness(1.06)}
  .q{background:var(--panel); border:1px solid var(--line);
     border-radius:14px; padding:18px 20px; margin-bottom:14px;
     box-shadow:var(--shadow)}
  .q .qn{font-size:11px; font-weight:700; letter-spacing:.12em;
     color:var(--accent-ink); text-transform:uppercase}
  .q h3{font-size:15px; font-weight:650; margin:4px 0 12px;
     letter-spacing:-.01em}
  .opt{display:flex; align-items:center; gap:12px; width:100%;
       text-align:left; border:1px solid var(--line);
       background:var(--panel2); border-radius:10px; padding:10px 14px;
       margin:7px 0; cursor:pointer; font-size:13.5px;
       transition:border-color .15s, background .15s}
  .opt .abc{flex:none; width:24px; height:24px; border-radius:8px;
       border:1px solid var(--line); background:var(--panel); display:grid;
       place-items:center; font-size:11.5px; font-weight:700;
       color:var(--dim)}
  .opt:hover{border-color:var(--accent)}
  .opt.pick{border-color:var(--accent); background:var(--accent-soft)}
  .opt.pick .abc{background:var(--accent); border-color:var(--accent);
       color:#fff}
  .opt.right{border-color:var(--good); background:var(--good-soft)}
  .opt.right .abc{background:var(--good); border-color:var(--good);
       color:#fff}
  .opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
  .opt.wrong .abc{background:var(--bad); border-color:var(--bad);
       color:#fff}
  .why{margin-top:10px; font-size:13px; color:var(--dim); display:none;
       border-top:1px dashed var(--line); padding-top:10px}
  .q.graded .why{display:block}
  .quizbar{display:flex; align-items:center; gap:16px; margin-top:4px}
  .qcancel{background:none; border:0; color:var(--dim); cursor:pointer;
       font-size:13px; text-decoration:underline}
  .scorecard{display:none; align-items:center; gap:14px;
       background:var(--panel); border:1px solid var(--line);
       border-radius:14px; padding:16px 20px; margin-bottom:14px;
       box-shadow:var(--shadow)}
  .scorecard.on{display:flex}
  .scorecard .big{font-size:24px; font-weight:750;
       letter-spacing:-.02em}
  .scorecard p{color:var(--dim); font-size:13px}
  body.quiz-view .stage, body.quiz-view .lessonbar{display:none}
  body.quiz-lock .railpanel{opacity:.35; pointer-events:none}
  #pane-quiz{max-width:780px}
  .multi{display:inline-block; font-size:10.5px; font-weight:700;
      letter-spacing:.08em; text-transform:uppercase;
      color:var(--accent-ink); background:var(--accent-soft);
      border-radius:6px; padding:2px 8px; margin-left:8px;
      vertical-align:2px}
  .quizside{background:var(--panel2); border:1px solid var(--line);
      border-radius:12px; padding:16px; margin:4px 0 12px;
      font-size:13px; color:var(--dim)}
  .quizside b{display:block; color:var(--ink); font-size:20px;
      font-weight:700; margin-bottom:2px}
  /* who is learning */
  .who{display:flex; align-items:center; gap:8px; font-size:12.5px;
      color:var(--shell-dim); white-space:nowrap}
  .who b{color:var(--shell-ink); font-weight:650}
  .who button{background:none; border:0; cursor:pointer; font-size:11.5px;
      color:var(--shell-dim); text-decoration:underline; padding:0}
  .namegate{position:fixed; inset:0; z-index:50; display:grid;
      place-items:center; background:rgba(10,11,14,.6);
      backdrop-filter:blur(6px)}
  .namegate.hidden{display:none}
  .namecard{background:var(--panel); border:1px solid var(--line);
      border-radius:16px; padding:34px 36px; width:min(420px, 90vw);
      box-shadow:var(--shadow); text-align:center}
  .namecard h3{font-size:17px; font-weight:650; margin:10px 0 4px}
  .namecard p{color:var(--dim); font-size:13px; margin-bottom:18px}
  .namecard input{width:100%; font:inherit; color:var(--ink);
      background:var(--panel2); border:1px solid var(--line);
      border-radius:10px; padding:11px 14px; outline:none;
      margin-bottom:12px; text-align:center}
  .namecard input:focus{border-color:var(--accent)}
  .result-actions{display:flex; gap:10px; margin-left:auto}
  .result-actions a, .result-actions button{display:inline-flex;
      align-items:center; border:1px solid var(--line); background:none;
      color:var(--ink); border-radius:9px; padding:7px 14px;
      font-size:12.5px; font-weight:600; cursor:pointer;
      text-decoration:none}
  .result-actions a:hover, .result-actions button:hover{
      border-color:var(--accent)}

  /* ---------- downloads ---------- */
  .dl{display:flex; align-items:center; gap:14px;
      background:var(--panel); border:1px solid var(--line);
      border-radius:12px; padding:13px 16px; margin-bottom:10px;
      color:var(--ink); text-decoration:none; box-shadow:var(--shadow);
      transition:border-color .15s}
  .dl:hover{border-color:var(--accent)}
  .dl .kind{flex:none; width:42px; height:42px; border-radius:10px;
      display:grid; place-items:center; font-size:10.5px; font-weight:750;
      letter-spacing:.05em; color:#fff}
  .k-ZIP{background:#6d5ae0}.k-MP4{background:#ff7a1a}
  .k-PPT{background:#d0491b}.k-DOC{background:#2b7cd3}
  .dl .t{flex:1; min-width:0}
  .dl .t b{display:block; font-size:13.5px; font-weight:650;
      letter-spacing:-.01em}
  .dl .t span{font-size:12px; color:var(--dim)}
  .dl .get{flex:none; color:var(--accent-ink); font-weight:650;
      font-size:12.5px}
</style>
</head>
<body>
<header class="shell">
  <div class="mark"><svg width="14" height="14" viewBox="0 0 14 14">
    <path d="M3.5 1.8v10.4L11.7 7z" fill="#fff"/></svg></div>
  <div class="crumb"><div class="eyebrow">Course</div>
    <h1>Application Delivery Guidelines</h1></div>
  <div class="grow"></div>
  <div class="who" id="who"></div>
  <div class="progress">
    <span class="meta" id="hmeta"></span>
    <div class="pbar"><i id="pfill"></i></div>
    <span class="pct" id="ppct">0%</span>
  </div>
  <button class="iconbtn" id="theme" title="Light / dark">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"
      stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <circle cx="7.5" cy="7.5" r="3.2"/>
      <path d="M7.5 .8v1.6M7.5 12.6v1.6M.8 7.5h1.6M12.6 7.5h1.6M2.8 2.8l1.1
        1.1M11.1 11.1l1.1 1.1M12.2 2.8l-1.1 1.1M3.9 11.1l-1.1 1.1"/>
    </svg></button>
</header>

<div class="namegate hidden" id="namegate">
  <div class="namecard">
    <div class="mark" style="margin:0 auto"><svg width="14" height="14"
      viewBox="0 0 14 14"><path d="M3.5 1.8v10.4L11.7 7z" fill="#fff"/>
      </svg></div>
    <h3>Welcome to the course</h3>
    <p>Enter your name so your progress and quiz result carry it.</p>
    <input id="namein" placeholder="Your full name" maxlength="60"
      autocomplete="name">
    <button class="cta" id="namego">Start learning</button>
  </div>
</div>
<div class="wrap" id="wrap">
  <aside class="railpanel" id="railpanel">
    <div class="railhead">
      <div class="grow"><h2>Course content</h2><p id="railmeta"></p></div>
      <button class="fold" id="fold" title="Collapse the course content">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M7.5 2.5 4 6l3.5 3.5"/></svg></button>
    </div>
    <div class="railbody" id="rail"></div>
  </aside>
  <main>
    <div class="stage"><video id="v" controls preload="metadata"></video>
    </div>
    <div class="lessonbar">
      <div><div class="eyebrow" id="leyebrow"></div>
        <h2 id="ltitle"></h2></div>
      <div class="grow"></div>
      <button class="navbtn" id="prev">&#8592; Previous</button>
      <button class="navbtn" id="next">Next lesson &#8594;</button>
    </div>
    <section class="pane" id="pane-quiz"></section>
  </main>
  <aside class="side">
    <nav class="tabs" id="tabs"></nav>
    <div class="sidebody">
      <div class="quizside hidden" id="quizside"></div>
      <section class="pane" id="pane-transcript"></section>
      <section class="pane" id="pane-downloads"></section>
    </div>
  </aside>
</div>
<script>
const DATA = {"title": "Application Delivery Guidelines", "lessons": [{"n": 1, "title": "Choosing the Right Project Type", "video": "lesson_01.mp4", "duration": 142.334, "chapters": [{"key": "title", "slide": "title_slide.png", "text": "Hello, and welcome. Today we are going to look at Deliver Oracle Projects Using Vigilant's Application Delivery Guidelines.", "module": 1, "start": 0.0, "duration": 9.3, "heading": "Welcome"}, {"key": "agenda", "slide": "agenda_slide.png", "text": "We will cover choosing the right project type, operating the three-role delivery model, preparing the functional document set, controlling technical and conversion deliverables, running discovery, solution build, and crp, testing the solution and going live.", "module": 1, "start": 9.3, "duration": 17.5, "heading": "What we will cover"}, {"key": "s01", "slide": "slide_01.png", "text": "Vigilant runs six Oracle project types, and the first three carry the heaviest delivery load. Implementation, or transformation, is the most comprehensive engagement type: an end-to-end deployment of Fusion or E-Business Suite covering business process redesign, system configuration, data conversion, integrations, development, testing, training, and go-live support, often replacing legacy systems. A rollout expands an implementation that already exists to additional geographies, business units, legal entities, or operating units. It works from a predefined global template, and what you localize is configuration, data, and statutory requirements. An upgrade takes EBS or Fusion to a newer release, which means assessing impact, remediating customizations and integrations, and running regression testing to protect business continuity.", "module": 1, "start": 26.8, "duration": 56.267, "heading": "Matching Work to Implementation, Rollout, or Upgrade"}, {"key": "s02", "slide": "slide_02.png", "text": "The remaining three engagement types are lighter but equally defined. An assessment is a short-term advisory engagement that evaluates the current Oracle landscape - it may cover system health, functional fit-gap, performance, security, upgrade readiness, or roadmap planning, and it always ends in actionable recommendations rather than a build. Enhancements are targeted improvements to an existing Oracle estate: new functional capabilities, reports, integrations, dashboards, workflows, extensions, or process optimizations, delivered without a full reimplementation. Managed support is the ongoing service after go-live, covering incident management, minor enhancements, monitoring, patches, and continuous improvement to keep the system stable, compliant, and delivering business value. Confirm which type you are running before scoping anything, because documents and phase expectations differ by type.", "module": 1, "start": 83.067, "duration": 59.267, "heading": "Scoping Assessments, Enhancements, and Managed Support"}]}, {"n": 2, "title": "Operating the Three-Role Delivery Model", "video": "lesson_02.mp4", "duration": 108.234, "chapters": [{"key": "s03", "slide": "slide_03.png", "text": "Vigilant's delivery model has three role categories, and every activity on a project maps to one of them. The Enterprise Architect is accountable for the overall project outcome: end-to-end solution integrity, client success, strategic direction, major decisions and escalations, and the final Go-Live recommendation. The Project Manager and PMO own project management and delivery governance - the integrated plan, budget and forecast tracking, scope and change administration, RAID management, and reporting. The Workstream Delivery Team owns the detailed work: discovery, requirements, design, configuration, development, conversion, testing, and documentation within its assigned workstream. That team includes the Module Head, who is the subject matter expert, plus the Functional Architect, Technical Architect, Functional Consultants, and Technical Developers.", "module": 2, "start": 0.0, "duration": 57.367, "heading": "Assigning Accountability Across Three Role Categories"}, {"key": "s04", "slide": "slide_04.png", "text": "The boundaries between these roles matter as much as the roles themselves. The Enterprise Architect is not expected to personally perform every detailed task - the obligation is to ensure qualified owners are assigned, decisions get made, and quality is acceptable. The Project Manager does not own functional, technical, or architecture decisions; the PM ensures each one has an owner, a due date, and an escalation path. Workstream Leads may not change approved scope, design direction, or committed dates on their own - those moves go through EA and PM governance. And when a material scope, budget, or Go-Live trade-off arises, it follows a fixed path: the Enterprise Architect recommends, the Project Manager assesses the impact, and the client or Steering Committee approves.", "module": 2, "start": 57.367, "duration": 50.867, "heading": "Respecting Role Boundaries and Escalation Rules"}]}, {"n": 3, "title": "Operating the Three-Role Delivery Model (part 2)", "video": "lesson_03.mp4", "duration": 57.733, "chapters": [{"key": "s05", "slide": "slide_05.png", "text": "Accountability shifts in emphasis as the project moves through phases, but the pattern holds. At Mobilization the Enterprise Architect validates the SOW, scope, estimates, staffing, and budget baseline, and later confirms the project has met the solution, deliverable, decision, defect, and risk criteria to enter CRP, SIT, UAT, Production Cutover, and Hypercare - any exception must be assessed and documented. The PM and PMO maintain the governance artifacts throughout: the Project Charter, the integrated plan, RAID and Change Control logs, test governance, the integrated Cutover Plan, and the Go-Live Readiness Checklist. Workstream Leads answer for the quality, review, and timely completion of every deliverable assigned in the Document Accountability Matrix. The final Go-Live recommendation must rest on objective readiness evidence, never on optimism.", "module": 3, "start": 0.0, "duration": 57.733, "heading": "Tracking Accountability Through Each Phase"}]}, {"n": 4, "title": "Preparing the Functional Document Set", "video": "lesson_04.mp4", "duration": 100.634, "chapters": [{"key": "s06", "slide": "slide_06.png", "text": "The Requirement Traceability Matrix is the primary requirements document. Only Functional Architects prepare and update it; Functional SMEs review and validate, and their feedback routes back to the Architects for the update. Each requirement follows the same path. First, discussion notes are captured in a strict format - date, initials, then the comment - and they accumulate as the minutes of meeting; you never overwrite an earlier entry. Once the requirement is genuinely understood, you fill the Summarized Requirements column - every row must eventually carry one. From there the row moves to Requires Approval and then Approved. That row-level approval is deliberate: it finalizes requirements incrementally rather than in one big sign-off, and every row must be Approved and the RTM baselined before System Integration Testing begins.", "module": 4, "start": 0.0, "duration": 54.467, "heading": "Capturing Requirements in the RTM"}, {"key": "s07", "slide": "slide_07.png", "text": "Three documents turn approved requirements into a buildable solution. First, the Solution Design Document, written by Functional SMEs, maps requirements to Oracle features in business language and is approved before SIT, once CRP feedback and sign-off are incorporated. Second, the Configuration Workbook records every setup value, module by module - it is the single source of truth for functional setups and must be approved before production. Third, the process flows. These are drawn in Visio using the Vigilant template exactly as provided - flowing left to right, from inputs to outputs, with no Start or End symbols. Decision arrows carry meaning: green means yes, red means no.", "module": 4, "start": 54.467, "duration": 46.167, "heading": "Writing the SDD, CWB, and Process Flows"}]}, {"n": 5, "title": "Preparing the Functional Document Set (part 2)", "video": "lesson_05.mp4", "duration": 107.8, "chapters": [{"key": "s08", "slide": "slide_08.png", "text": "Workshops and decisions have their own artifacts. The Workshop Design Document is a client-agnostic deck maintained per Oracle module; at project start you copy it, tailor it to scope, and review it internally with the Service Delivery Manager or Project Manager before presenting to the client. In the workshop you present the options, and the business decides. Each decision lands in the Functional Key Design Decision Document: the options considered with their pros and cons, the team's recommendation highlighted in green, and the approver with the decision date. The Functional Architect then summarizes every approved decision in the RAID log as well. And approved decisions are binding - they drive the SDD, configuration, development, and testing - so changing one afterward requires formal change control, not a quiet revision.", "module": 5, "start": 0.0, "duration": 53.633, "heading": "Running Workshops and Recording Design Decisions"}, {"key": "s09", "slide": "slide_09.png", "text": "Three more functional documents carry the solution to its users. The Change Impact Assessment Document records only what is changing - the current AS-IS behavior, the TO-BE behavior, and the roles impacted - never unchanged processes, and it must be finalized before end-user training and UAT. Functional test scripts are written by Functional SMEs, who map each script to a test scenario; those scenarios must be realistic day-in-the-life business flows, not just Oracle functions, and the business approves them before SIT execution while Functional Architects verify the coverage. Finally, Training Manuals teach users how to operate the approved solution - they reflect only approved functionality, and they never substitute for the RTM or the SDD, which remain the authoritative records of requirements and design.", "module": 5, "start": 53.634, "duration": 54.167, "heading": "Preparing Change Impact, Test Scripts, and Training Manuals"}]}, {"n": 6, "title": "Controlling Technical and Conversion Deliverables", "video": "lesson_06.mp4", "duration": 109.534, "chapters": [{"key": "s10", "slide": "slide_10.png", "text": "Every non-standard component lives in the RICEFW Inventory - RICEFW stands for Reports, Integrations, Conversions, Extensions, Forms, and Workflows. The Technical Solution Architect prepares and maintains it, Functional Architects review it for alignment with requirements, and it is the single source of truth for all technical development. It is baselined before development starts and finalized before production, and any addition, removal, or scope change goes through formal change control. Each approved component then gets a Technical Requirement and Design Document. Functional SMEs write the business requirement and functional context; Technical Developers write the technical architecture and design; the Technical Solution Architect validates it.", "module": 6, "start": 0.0, "duration": 51.167, "heading": "Maintaining the RICEFW Inventory and TRDDs"}, {"key": "s11", "slide": "slide_11.png", "text": "Architectural decisions that cut across components go into the Technical Key Design Decision Document - one deck for the whole project, while object-level design stays in each TRDD. The Technical Solution Architect owns it, presenting at least two options where feasible with pros, cons, risks, and mitigations. The Enterprise Architect reviews for architecture alignment and the Service Delivery Manager for delivery impact, each decision is summarized in the RAID SharePoint list, and approval is required before any impacted development starts. Decisions touching environments, security, or integrations must be reaffirmed before production deployment. Alongside it, Technical Architecture Process Flows in Visio, in the Vigilant scheme, show system-to-system interactions, data flow direction, error handling, and security touchpoints - approved before integration and extension development begins.", "module": 6, "start": 51.167, "duration": 58.367, "heading": "Recording Architecture Decisions and Technical Flows"}]}, {"n": 7, "title": "Controlling Technical and Conversion Deliverables (part 2)", "video": "lesson_07.mp4", "duration": 111.866, "chapters": [{"key": "s12", "slide": "slide_12.png", "text": "Code moves through environments only under the Code Migration Document, which records what is being migrated along the path from DEV through TEST and UAT to production, the deployment steps, the validation and rollback plan, and the responsible owner and approver. Before anything promotes at all, unit testing gates it: only components with a Pass result move to SIT or UAT, and any exception needs Technical Solution Architect approval. One policy is mandatory: the package deployed to UAT is identical to the package deployed to production - no code changes, recompilations, or manual fixes are permitted in between. If UAT finds a defect, you fix it in a non-UAT development environment, rebuild the package, and redeploy it to UAT first, so production only ever receives the tested package.", "module": 7, "start": 0.0, "duration": 53.933, "heading": "Migrating Code and Proving Unit Tests"}, {"key": "s13", "slide": "slide_13.png", "text": "Data conversion runs on the Conversion Rules Document. For each conversion object - customers, suppliers, items, open transactions - it defines the source entities, the target Oracle objects, field-level mappings, transformation and derivation rules, cleansing and defaulting logic, load sequencing, and the validation and reconciliation rules that prove the load worked. The Conversion SME prepares it with support from Technical Developers and Functional SMEs; the Conversion Lead, Functional SMEs, and Technical Solution Architect review it. It must be approved before conversion development starts, and business data owners validate it during mock conversion cycles, where the rules are refined iteratively. Final approval is required before the production cutover conversion - and remember that data quality remains a shared responsibility between the business and the project team.", "module": 7, "start": 53.933, "duration": 57.933, "heading": "Defining Conversion Rules in the CRD"}]}, {"n": 8, "title": "Running Discovery, Solution Build, and CRP", "video": "lesson_08.mp4", "duration": 103.633, "chapters": [{"key": "s14", "slide": "slide_14.png", "text": "Discovery is about understanding and alignment, not module-level design. You start by studying the client's AS-IS processes through facility visits and stakeholder interviews, capturing pain points and high-level requirements in the RTM - detail comes later. Functions outside the future state get a high-level discussion, then either a deep dive or a Not Applicable marking in the RTM. Next comes the enterprise structure - legal entities, ledgers, business units, and the Chart of Accounts - designed through Workshop Design Document sessions with a Key Design Decision deck laying out the options. Throughout, collect real sample data: actual suppliers, customers, items, and pricing. Never demonstrate with a Test Supplier - realism is what earns the client's engagement.", "module": 8, "start": 0.0, "duration": 50.0, "heading": "Laying the Foundation in Discovery"}, {"key": "s15", "slide": "slide_15.png", "text": "Before Solution Build begins, the Functional Architect checks the Meeting Agenda sheet in the RTM, which lists the workshop topics and estimated hours - and prepares one if it is missing. From those hours and the committed timeline, the Architect and PMO set the recurring cadence: if Purchasing needs roughly eighty workshop hours across twenty working days, that is a four-hour session every day. In the sessions themselves, demonstrate Oracle standard functionality and let the RTM questions guide the conversation - the objective is understanding the business need, not recording answers question by question - then refine the solution with the client until it is agreed. Treat additional sessions as exceptions to raise with PMO, and reserve ad hoc meetings for genuinely unexpected issues, not for work the cadence should have covered.", "module": 8, "start": 50.0, "duration": 53.633, "heading": "Planning and Running Solution Build Workshops"}]}, {"n": 9, "title": "Running Discovery, Solution Build, and CRP (part 2)", "video": "lesson_09.mp4", "duration": 110.767, "chapters": [{"key": "s16", "slide": "slide_16.png", "text": "Once a requirement and its solution are agreed, the row moves through a fixed sequence. Write the Summarized Requirement in plain, user-understandable language, using the two standard phrasings where they fit: Standard Functionality Accepted when the business adopts Oracle as delivered, and Capability Not Required when a capability does not apply. Set the status to Requires Approval, and email the RTM row numbers in the follow-up after each meeting. The client reviews, adds initials and the approval date in the Notes, and flips the status to Approved. Classify every row Fit or Gap along the way. And watch one signal closely: if sessions are progressing while Summarized Requirements sit blank, that is a project warning - it means requirements are being discussed but never landed.", "module": 9, "start": 0.0, "duration": 50.0, "heading": "Approving Requirements Row by Row"}, {"key": "s17", "slide": "slide_17.png", "text": "In Solution Build, users saw Oracle capabilities independently; the Conference Room Pilot presents everything as one integrated, end-to-end business process, including custom roles and whatever RICEFW components are ready, with integrations shown through available interfaces or agreed workarounds. All feedback goes into the CRP Issue Tracker, classified by severity, priority, owner, and target date - and be careful to distinguish genuine defects from design changes, new requirements, and training issues, because each follows a different path. Critical and high-priority resolutions are re-demonstrated before CRP closes. CRP also hosts the first sample data conversion: a limited but representative data set, reconciled against the source on record counts, balances, and key attributes. CRP sign-off then baselines and locks the requirements and solution design for SIT and UAT.", "module": 9, "start": 50.0, "duration": 60.767, "heading": "Validating End to End in CRP"}]}, {"n": 10, "title": "Testing the Solution and Going Live", "video": "lesson_10.mp4", "duration": 177.867, "chapters": [{"key": "s18", "slide": "slide_18.png", "text": "SIT proves the configured application, RICEFW components, converted data, security roles, and external systems work together. After the SIT build is deployed, run the Full Load data conversion and validate record counts, balances, and mappings. Then the Vigilant team performs readiness testing - executing the scenarios itself so no system-level issues block the testers when formal execution starts. The scenarios are day-in-the-life sequences: transactions ordered as they occur in a real business day, including approvals, exceptions, corrections, inquiries, and reporting - and the business approves them before execution. The same scenario library serves both SIT and UAT, with execution adjusted to each phase's purpose. During execution, every defect is logged in the agreed tracking tool, fixed, retested, and regression tested; once results are clean, you obtain UAT readiness sign-off.", "module": 10, "start": 0.0, "duration": 61.067, "heading": "Executing System Integration Testing"}, {"key": "s19", "slide": "slide_19.png", "text": "User Acceptance Testing confirms the solution supports real business operations, and it must not be treated as script execution alone - users simulate a typical day or week of operations wherever practical. After the full load UAT conversion is validated, the Vigilant team runs readiness testing so every system-level issue is resolved before business users begin, and users are trained on the future-state processes first. During execution, assign scenarios based on users' actual roles and responsibilities, with realistic data, volumes, approvals, exceptions, corrections, inquiries, and reporting - and monitor that users are testing real operations, not completing a checklist. Classify every issue as a defect, training gap, data issue, or change request, because each follows a different path.", "module": 10, "start": 61.067, "duration": 54.367, "heading": "Running Day-in-the-Life UAT"}, {"key": "s20", "slide": "slide_20.png", "text": "Production Cutover runs in two sub-phases. Pre-Blackout Cutover covers everything that can happen before the final shutdown window: migrate approved configurations to Production, deploy RICEFW components, integrations, reports, workflows, and custom roles, and perform the planned master data conversion - keeping configurations, schedules, and user access dormant until Go-Live. Then create a clone of Production and smoke test critical end-to-end flows in it; every required fix is applied in both the clone and Production, and critical processes are retested. Blackout Cutover happens in the shutdown window itself: migrate incremental master data, convert approved open transactions and outstanding balances, reconcile and validate, then enable integrations, scheduled processes, workflows, and user access.", "module": 10, "start": 115.434, "duration": 55.2, "heading": "Executing Production Cutover"}, {"key": "closing", "slide": "closing_slide.png", "text": "That completes the Application Delivery Guidelines - apply them on your next engagement.", "module": 10, "start": 170.634, "duration": 7.233, "heading": "Wrap-up"}]}], "quiz": {"title": "Application Delivery Guidelines", "questions": [{"question": "A client with a live Oracle implementation wants to extend it to two new legal entities in another country, using the existing global template with localized configurations and statutory requirements. Which Vigilant project type is this?", "options": ["Implementation / Transformation", "Rollout", "Upgrade", "Enhancement"], "answers": ["B"], "why": "Rollout is defined as expanding an existing implementation to new geographies, business units, or legal entities using a predefined global template with localizations.", "difficulty": 1}, {"question": "In the RICEFW Inventory, what does the acronym RICEFW stand for?", "options": ["Requirements, Integrations, Configurations, Enhancements, Forms, Workflows", "Reports, Interfaces, Customizations, Extensions, Fields, Workbooks", "Reports, Integrations, Conversions, Extensions, Forms, Workflows", "Requirements, Interfaces, Conversions, Enhancements, Functions, Workflows"], "answers": ["C"], "why": "The document defines RICEFW as Reports, Integrations, Conversions, Extensions, Forms, Workflows.", "difficulty": 1}, {"question": "In Vigilant's delivery model, who is accountable for the final Go-Live recommendation, which must be supported by objective readiness evidence?", "options": ["The Project Manager / PMO", "The Technical Solution Architect", "The client Steering Committee", "The Enterprise Architect"], "answers": ["D"], "why": "The Enterprise Architect is repeatedly named as accountable for the Go-Live recommendation, supported by objective readiness evidence.", "difficulty": 1}, {"question": "A Functional SME notices an error in an RTM row and wants to correct it. According to RTM governance, what is the correct way for this update to happen?", "options": ["The SME edits the RTM directly, since SMEs own requirement documentation", "The SME provides the feedback to a Functional Architect, because only Functional Architects prepare and update the RTM", "The SME logs it in the RAID list and waits for the Enterprise Architect to update the RTM", "The SME raises a formal change request, since any RTM edit requires change control"], "answers": ["B"], "why": "The RTM is prepared and updated by Functional Architects only; SMEs review and must route all feedback to the Architects (change control applies only to already-approved rows).", "difficulty": 2}, {"question": "A defect is found in an integration during UAT. Under the mandatory Code Migration Control Policy, what must the team do?", "options": ["Fix the code directly in UAT so testing can resume quickly, then copy the fix to PROD", "Fix the code in a non-UAT development environment, redeploy the updated package to UAT, and only promote it to PROD after successful UAT validation", "Promote the original UAT package to PROD as scheduled and apply the fix as a PROD patch after Go-Live", "Recompile the component during the PROD deployment window so UAT and PROD end up functionally equivalent"], "answers": ["B"], "why": "The policy requires fixes only in non-UAT dev environments and that the validated UAT package be the identical, authoritative package promoted to PROD; direct fixes in UAT or during PROD deployment are strictly prohibited.", "difficulty": 2}, {"question": "A Functional Architect has tailored the Workshop Design Document (WDD) for a project and is ready to present it to the client. What approval step applies before presentation?", "options": ["Formal client sign-off must be obtained, like other functional documents", "It must be approved by the Enterprise Architect as a phase-gate deliverable", "It requires internal review with the Service Delivery Manager and/or Project Manager, but no formal client approval", "No review is needed because the WDD is a reusable methodology asset"], "answers": ["C"], "why": "The WDD does not require formal client approval but must be reviewed internally with the SDM and/or PM before presentation.", "difficulty": 2}, {"question": "During a Solution Build workshop, the business reviews a demonstrated Oracle standard capability and confirms it fully supports their process with no client-specific requirements or gaps. What should the Functional Architect do in the RTM?", "options": ["Leave the Summarized Requirement blank since there is no real requirement, and mark the row Approved", "Record the prescribed 'Standard Functionality Accepted' wording in the Summarized Requirement, add a dated note, set the status to Requires Approval, and ask the client to approve the row", "Delete the row so the RTM tracks only gaps and custom requirements", "Mark the row 'Capability Not Required' since nothing custom needs to be built"], "answers": ["B"], "why": "Every row must eventually have a Summarized Requirement and reach Approved status; adopted standard functionality gets the specific 'Standard Functionality Accepted' wording, while 'Capability Not Required' is reserved for capabilities that will not be used.", "difficulty": 2}, {"question": "A team building a future-state business process flow needs only 4 of the 6 swim lanes in the Vigilant Visio template. Per the flow preparation guidelines, what should they do?", "options": ["Delete Lanes 5 and 6, keeping the remaining lanes in the template's original order", "Delete whichever two lanes are least relevant, even if they sit between other lanes", "Reorder the lanes so the four used ones read most logically top to bottom", "Keep all six lanes and mark two of them 'Not Applicable'"], "answers": ["A"], "why": "The guidelines forbid deleting from in-between or reordering swim lanes and give exactly this example: if only 4 lanes are required, delete Lanes 5 and 6.", "difficulty": 2}, {"question": "The team must document the error-handling and retry design for one specific supplier integration. According to the stated scope boundaries, where does this design belong?", "options": ["In the Technical Key Design Decision Document (TKDD), since it is a technical decision", "In the Technical Requirement & Design Document (TRDD) for that RICEFW component", "In the Technical Architecture Process Flows, which capture detailed technical specifications", "In the Functional Key Design Decision Document (FKDD) for the module"], "answers": ["B"], "why": "The TKDD explicitly captures program-level architectural decisions while object-level technical design for each RICEFW component lives in the TRDD; architecture flows are expressly not detailed specifications.", "difficulty": 2}, {"question": "Select all that apply: Which activities belong to the BLACKOUT Cutover sub-phase (the final shutdown window immediately before Go-Live)?", "options": ["Migrating incremental master data created since the earlier conversion", "Deploying RICEFW components, integrations, and custom roles to Production", "Converting approved open transactions and outstanding balances", "Performing the planned master data conversion"], "answers": ["A", "C"], "why": "Blackout Cutover covers incremental master data and open-transaction conversion plus activation, while RICEFW deployment and the planned master data conversion happen in Pre-Blackout Cutover.", "difficulty": 2}, {"question": "Select all that apply: Which of these documents must be APPROVED before System Integration Testing (SIT) commences?", "options": ["Requirement Traceability Matrix (RTM)", "Solution Design Document (SDD)", "Configuration Workbook (CWB)", "Functional Test Scripts and Scenario Mapping"], "answers": ["A", "B", "D"], "why": "The RTM, SDD, and Functional Test Scripts must be approved before SIT, whereas the CWB is only reviewed before SIT/UAT and needs approval only before PROD \u2014 the trap for skimmers.", "difficulty": 3}, {"question": "Select all that apply: A material trade-off on the committed Go-Live date is under discussion. According to the Key Role Boundaries, which statements are correct?", "options": ["The Enterprise Architect provides the solution, quality, risk, and delivery recommendation", "The Project Manager provides the schedule, budget, scope, governance, and execution impact", "A Workstream Lead may independently commit to the new date for their own workstream", "Where required, the appropriate client or Steering Committee authority approves the decision"], "answers": ["A", "B", "D"], "why": "Material trade-offs require a coordinated EA + PM assessment with client/Steering approval where required, and Workstream Leads may not independently change committed dates without EA and PM governance.", "difficulty": 3}]}, "downloads": [{"label": "Complete course", "file": "course.zip", "kind": "ZIP", "bytes": 47180623}, {"label": "Lesson 1 \u2014 Choosing the Right Project Type", "file": "lesson_01.mp4", "kind": "MP4", "bytes": 5837730}, {"label": "Lesson 2 \u2014 Operating the Three-Role Delivery Model", "file": "lesson_02.mp4", "kind": "MP4", "bytes": 3473559}, {"label": "Lesson 3 \u2014 Operating the Three-Role Delivery Model (part 2)", "file": "lesson_03.mp4", "kind": "MP4", "bytes": 1737015}, {"label": "Lesson 4 \u2014 Preparing the Functional Document Set", "file": "lesson_04.mp4", "kind": "MP4", "bytes": 3092440}, {"label": "Lesson 5 \u2014 Preparing the Functional Document Set (part 2)", "file": "lesson_05.mp4", "kind": "MP4", "bytes": 3348830}, {"label": "Lesson 6 \u2014 Controlling Technical and Conversion Deliverables", "file": "lesson_06.mp4", "kind": "MP4", "bytes": 3404679}, {"label": "Lesson 7 \u2014 Controlling Technical and Conversion Deliverables (part 2)", "file": "lesson_07.mp4", "kind": "MP4", "bytes": 3397175}, {"label": "Lesson 8 \u2014 Running Discovery, Solution Build, and CRP", "file": "lesson_08.mp4", "kind": "MP4", "bytes": 3233906}, {"label": "Lesson 9 \u2014 Running Discovery, Solution Build, and CRP (part 2)", "file": "lesson_09.mp4", "kind": "MP4", "bytes": 3369802}, {"label": "Lesson 10 \u2014 Testing the Solution and Going Live", "file": "lesson_10.mp4", "kind": "MP4", "bytes": 5529231}, {"label": "Slide deck", "file": "slides.pptx", "kind": "PPT", "bytes": 10744228}, {"label": "Quiz, printable", "file": "quiz.docx", "kind": "DOC", "bytes": 10794}], "report": {"notify": "abhisheksamuel0409@proton.me", "url": null}, "poster": "poster.jpg"};

/* ---- theme ---- */
const TKEY = "course-theme";
const root = document.documentElement;
function setTheme(t){ root.dataset.theme = t;
  localStorage.setItem(TKEY, t); }
setTheme(localStorage.getItem(TKEY) ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
document.getElementById("theme").onclick = () =>
  setTheme(root.dataset.theme === "dark" ? "light" : "dark");

/* ---- who is learning ---- */
const UKEY = "course-user";
let user = localStorage.getItem(UKEY) || "";
const ngate = document.getElementById("namegate");
const namein = document.getElementById("namein");
function paintWho(){
  document.getElementById("who").innerHTML = user
    ? '<b>' + esc(user) + '</b><button id="switch">switch user</button>'
    : "";
  const sw = document.getElementById("switch");
  if (sw) sw.onclick = () => {
    user = "";
    localStorage.removeItem(UKEY);
    ngate.classList.remove("hidden");
    namein.value = "";
    setTimeout(() => namein.focus(), 50);
    paintWho();
  };
}
function saveName(){
  const n = namein.value.trim();
  if (!n) return;
  user = n;
  localStorage.setItem(UKEY, n);
  ngate.classList.add("hidden");
  paintWho();
}
document.getElementById("namego").onclick = saveName;
namein.addEventListener("keydown", e => e.key === "Enter" && saveName());
if (!user) {
  ngate.classList.remove("hidden");
  setTimeout(() => namein.focus(), 50);
}
paintWho();

/* ---- collapsible course content ---- */
document.getElementById("fold").onclick = () => {
  document.getElementById("railpanel").classList.toggle("collapsed");
  document.getElementById("wrap").classList.toggle("railless");
};

/* ---- progress state ---- */
const KEY = "course-progress:" + DATA.title;
const watched = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
let cur = 0;
function paintProgress(){
  const pct = Math.round(100 * watched.size / totalChaps);
  document.getElementById("pfill").style.width = pct + "%";
  document.getElementById("ppct").textContent = pct + "%";
}
paintProgress();

/* ---- curriculum rail ---- */
const rail = document.getElementById("rail");
DATA.lessons.forEach((l, li) => {
  const b = document.createElement("button");
  b.className = "les";
  b.innerHTML = '<span class="num">' + (many ? l.n : "&#9654;") +
    '</span><span class="t"><b>' + esc(l.title) + '</b><span>' +
    l.chapters.length + ' sections · ' + fmt(l.duration) +
    '</span></span><svg class="chev" width="12" height="12" viewBox=' +
    '"0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round"><path d="M2.5 4.5 6 8l3.5-3.5"/></svg>';
  b.dataset.lesson = li;
  b.onclick = e => {
    const grp = rail.querySelectorAll('.chap[data-lesson="' + li + '"]');
    if (b.classList.contains("on")) {          // toggle open/closed
      b.classList.toggle("closed");
      grp.forEach(x => x.classList.toggle("hidden"));
    } else {
      load(li, 0, true);
    }
  };
  rail.appendChild(b);
  l.chapters.forEach((c, ci) => {
    const cb = document.createElement("button");
    cb.className = "chap";
    cb.innerHTML = '<span class="ic">&#10003;</span><span class="t">' +
      esc(c.heading) + '</span><span class="len">' + fmt(c.duration) +
      '</span>';
    cb.onclick = () => load(li, c.start + 0.05, true);
    cb.dataset.lesson = li; cb.dataset.chap = ci;
    rail.appendChild(cb);
  });
});

/* ---- player ---- */
const prev = document.getElementById("prev");
const next = document.getElementById("next");
function load(li, at, play){
  if (!v.src.endsWith(DATA.lessons[li].video)) {
    v.src = DATA.lessons[li].video;
  }
  cur = li;
  v.currentTime = at || 0;
  if (play) v.play();
  document.getElementById("leyebrow").textContent = many
    ? "Lesson " + DATA.lessons[li].n + " of " + DATA.lessons.length : "";
  document.getElementById("ltitle").textContent = DATA.lessons[li].title;
  prev.disabled = li === 0;
  next.disabled = li === DATA.lessons.length - 1;
  prev.style.display = next.style.display = many ? "" : "none";
  document.querySelectorAll(".les").forEach(x =>
    x.classList.toggle("on", +x.dataset.lesson === li));
}
if (DATA.poster) v.poster = DATA.poster;
load(0, 0, false);
prev.onclick = () => cur > 0 && load(cur - 1, 0, true);
next.onclick = () => cur + 1 < DATA.lessons.length && load(cur + 1, 0, true);
v.addEventListener("ended", () => {
  if (cur + 1 < DATA.lessons.length) load(cur + 1, 0, true);
});

/* ---- tabs ---- */
const tabs = document.getElementById("tabs");
const panes = {Transcript: "pane-transcript", Quiz: "pane-quiz",
               Downloads: "pane-downloads"};
if (!DATA.quiz) delete panes.Quiz;
Object.keys(panes).forEach((name, i) => {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => {
    tabs.querySelectorAll("button").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".pane").forEach(x =>
      x.classList.remove("on"));
    b.classList.add("on");
    document.getElementById(panes[name]).classList.add("on");
    // the quiz takes the stage; the reader panel shows its progress
    const quizzing = name === "Quiz";
    document.body.classList.toggle("quiz-view", quizzing);
    document.getElementById("quizside").classList.toggle("hidden",
      !quizzing);
    if (quizzing) v.pause();
  };
  tabs.appendChild(b);
  if (i === 0) b.click();
});

/* ---- transcript, grouped by lesson ---- */
const tp = document.getElementById("pane-transcript");
DATA.lessons.forEach((l, li) => {
  if (many) {
    const g = document.createElement("div");
    g.className = "tgroup";
    g.innerHTML = '<span class="badge">Lesson ' + l.n +
      '</span><span class="t">' + esc(l.title) + '</span>';
    tp.appendChild(g);
  }
  l.chapters.forEach((c, ci) => {
    const d = document.createElement("div");
    d.className = "line";
    d.innerHTML = '<span class="st">' + fmt(c.start) +
      '</span><div><h3>' + esc(c.heading) + '</h3><p>' + esc(c.text) +
      '</p></div>';
    d.onclick = () => load(li, c.start + 0.05, true);
    d.dataset.lesson = li; d.dataset.chap = ci;
    tp.appendChild(d);
  });
});

/* ---- follow playback ---- */
v.addEventListener("timeupdate", () => {
  const t = v.currentTime, l = DATA.lessons[cur];
  let ci = -1;
  l.chapters.forEach((c, i) => { if (t >= c.start) ci = i; });
  if (ci >= 0) {
    const c = l.chapters[ci];
    if (t > c.start + c.duration * 0.8 && !watched.has(l.n + ":" + c.key)) {
      watched.add(l.n + ":" + c.key);
      localStorage.setItem(KEY, JSON.stringify([...watched]));
      paintProgress();
    }
  }
  document.querySelectorAll(".chap").forEach(x => {
    const mine = +x.dataset.lesson === cur && +x.dataset.chap === ci;
    x.classList.toggle("on", mine);
    const c = DATA.lessons[+x.dataset.lesson].chapters[+x.dataset.chap];
    x.classList.toggle("watched",
      watched.has(DATA.lessons[+x.dataset.lesson].n + ":" + c.key));
  });
  let active = null;
  document.querySelectorAll(".line").forEach(x => {
    const mine = +x.dataset.lesson === cur && +x.dataset.chap === ci;
    x.classList.toggle("on", mine);
    if (mine) active = x;
  });
  // the reader follows the narration without being asked
  if (active && lastLine !== active &&
      document.getElementById("pane-transcript").classList.contains("on")) {
    active.scrollIntoView({block: "nearest", behavior: "smooth"});
  }
  lastLine = active;
});
let lastLine = null;

/* ---- downloads ---- */
const dp = document.getElementById("pane-downloads");
(DATA.downloads || []).forEach(d => {
  const a = document.createElement("a");
  a.className = "dl";
  a.href = d.file;
  a.download = "";
  const mb = (d.bytes / 1048576).toFixed(1);
  a.innerHTML = '<span class="kind k-' + d.kind + '">' + d.kind +
    '</span><span class="t"><b>' + esc(d.label) + '</b><span>' + mb +
    ' MB</span></span><span class="get">Download</span>';
  dp.appendChild(a);
});

/* ---- quiz, taken closed-book on the main stage ---- */
if (DATA.quiz) {
  const qp = document.getElementById("pane-quiz");
  const side = document.getElementById("quizside");
  const N = DATA.quiz.questions.length;
  // one Set of picked option indexes per question; single-answer
  // questions behave as radios, multi-select as checkboxes
  const keyOf = q => (q.answers || [q.answer])
    .map(a => "ABCD".indexOf(a)).filter(i => i >= 0).sort();
  const picks = Array.from({length: N}, () => new Set());
  let started = false, graded = false;
  function paintSide(){
    const done = picks.filter(p => p.size).length;
    side.innerHTML = !started
      ? "<b>" + N + "</b>questions, easiest first"
      : graded ? "<b>Graded</b>scroll the questions to review"
      : "<b>" + done + " / " + N + "</b>answered so far";
  }
  paintSide();
  const gate = document.createElement("div");
  gate.className = "qgate";
  gate.innerHTML = '<div class="lock"><svg width="18" height="18" ' +
    'viewBox="0 0 18 18" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round"><rect x="3.2" y="7.5" ' +
    'width="11.6" height="8" rx="2"/><path d="M5.8 7.5V5.6a3.2 3.2 0 0 1 ' +
    '6.4 0v1.9"/></svg></div><h3>Ready for the quiz?</h3><p>' + N +
    ' questions, easiest first, harder as you go — a few are select-all-' +
    'that-apply. While the quiz is in progress the video, transcript and ' +
    'downloads are locked; they come back when you submit.</p>';
  const startBtn = document.createElement("button");
  startBtn.className = "cta";
  startBtn.textContent = "Start the quiz";
  gate.appendChild(startBtn);
  qp.appendChild(gate);
  const scorecard = document.createElement("div");
  scorecard.className = "scorecard";
  qp.appendChild(scorecard);
  const qbody = document.createElement("div");
  qbody.style.display = "none";
  qp.appendChild(qbody);
  function lock(on){
    document.body.classList.toggle("quiz-lock", on);
    tabs.querySelectorAll("button").forEach(b => {
      if (b.textContent !== "Quiz") b.disabled = on;
    });
  }
  startBtn.onclick = () => {
    if (!user) {                      // no anonymous attempts
      ngate.classList.remove("hidden");
      setTimeout(() => namein.focus(), 50);
      return;
    }
    started = true;
    lock(true);
    gate.style.display = "none";
    qbody.style.display = "";
    paintSide();
  };
  DATA.quiz.questions.forEach((q, qi) => {
    const multi = keyOf(q).length > 1;
    const card = document.createElement("div");
    card.className = "q";
    card.innerHTML = '<div class="qn">Question ' + (qi+1) + " of " + N +
      '</div><h3>' + esc(q.question) +
      (multi ? '<span class="multi">Select all that apply</span>' : "") +
      '</h3>';
    q.options.forEach((o, oi) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = '<span class="abc">' + "ABCD"[oi] +
        '</span><span>' + esc(o) + '</span>';
      b.onclick = () => {
        if (graded) return;
        if (multi) {
          picks[qi].has(oi) ? picks[qi].delete(oi) : picks[qi].add(oi);
          b.classList.toggle("pick");
        } else {
          picks[qi].clear();
          picks[qi].add(oi);
          card.querySelectorAll(".opt").forEach(x =>
            x.classList.remove("pick"));
          b.classList.add("pick");
        }
        paintSide();
      };
      card.appendChild(b);
    });
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = q.why || "";
    card.appendChild(why);
    qbody.appendChild(card);
  });
  const bar = document.createElement("div");
  bar.className = "quizbar";
  const go = document.createElement("button");
  go.className = "cta";
  go.textContent = "Submit answers";
  const cancel = document.createElement("button");
  cancel.className = "qcancel";
  cancel.textContent = "Cancel — back to the course";
  bar.appendChild(go); bar.appendChild(cancel);
  qbody.appendChild(bar);
  cancel.onclick = () => {
    started = false;
    picks.forEach(p => p.clear());
    qbody.querySelectorAll(".opt").forEach(x => x.classList.remove("pick"));
    lock(false);
    qbody.style.display = "none";
    gate.style.display = "";
    paintSide();
  };
  go.onclick = () => {
    let right = 0;
    graded = true;
    lock(false);
    cancel.style.display = "none";
    go.style.display = "none";
    qbody.querySelectorAll(".q").forEach((card, qi) => {
      const correct = keyOf(DATA.quiz.questions[qi]);
      card.classList.add("graded");
      card.querySelectorAll(".opt").forEach((b, oi) => {
        if (correct.includes(oi)) b.classList.add("right");
        else if (picks[qi].has(oi)) b.classList.add("wrong");
      });
      if (correct.length === picks[qi].size &&
          correct.every(i => picks[qi].has(i))) right++;
    });
    const rec = {course: DATA.title, name: user,
                 score: right + " / " + N,
                 percent: Math.round(100 * right / N),
                 date: new Date().toISOString().slice(0, 10)};
    const summary = "Course result\n" +
      "Name: " + rec.name + "\nCourse: " + rec.course +
      "\nScore: " + rec.score + " (" + rec.percent + "%)" +
      "\nDate: " + rec.date;
    scorecard.classList.add("on");
    scorecard.innerHTML = '<span class="big">' + right + " / " + N +
      '</span><p><b>' + esc(user) + '</b> · ' + rec.date + '<br>' +
      (right === N ? "Perfect score — nicely done." :
      right >= N * 0.7 ? "Solid pass. Review the marked answers below." :
      "Worth a rewatch — the explanations below say why.") + '</p>' +
      '<div class="result-actions" id="ractions"></div>';
    const ra = document.getElementById("ractions");
    const copy = document.createElement("button");
    copy.textContent = "Copy result";
    copy.onclick = () => navigator.clipboard.writeText(summary)
      .then(() => copy.textContent = "Copied ✓");
    ra.appendChild(copy);
    if (DATA.report && DATA.report.notify) {
      const mail = document.createElement("a");
      mail.textContent = "Email result";
      mail.href = "mailto:" + DATA.report.notify +
        "?subject=" + encodeURIComponent(
          "Course result: " + rec.course + " — " + rec.name) +
        "&body=" + encodeURIComponent(summary);
      ra.appendChild(mail);
    }
    if (DATA.report && DATA.report.url) {
      // fire-and-forget: Google Forms / Power Automate / any endpoint.
      // text/plain avoids a CORS preflight a static page cannot answer.
      fetch(DATA.report.url, {method: "POST", mode: "no-cors",
        headers: {"Content-Type": "text/plain"},
        body: JSON.stringify(rec)}).catch(() => {});
    }
    scorecard.scrollIntoView({behavior: "smooth", block: "center"});
    paintSide();
  };
}
</script>
</body>
</html>
